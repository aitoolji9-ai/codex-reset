[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-reset-notifier"
version = "1.1.0"
description = "Channel-independent Codex reset announcement monitor"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
codex-reset-notifier = "cli:main"

[tool.setuptools]
py-modules = ["cli", "reset_notifier", "transport", "notify"]
